name: Build Radar Cripto APK (encrypted source)

on:
  push:
    branches:
      - radar-cripto-apk-public-build
    paths:
      - 'radar-public-build/radar-android-v7.15.0.tar.xz.enc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RADAR_BUILD_KEY: ${{ secrets.RADAR_BUILD_KEY }}

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Validate build secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RADAR_BUILD_KEY:-}" || { echo 'RADAR_BUILD_KEY is missing'; exit 2; }

      - name: Verify encrypted payload fingerprint
        shell: bash
        run: |
          set -euo pipefail
          echo '7ac274b102a26a1d55a168dc856ab5eaeb144a17c9c95c2fccb330398c77ea35  radar-public-build/radar-android-v7.15.0.tar.xz.enc' | sha256sum -c -

      - name: Decrypt Android source
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in radar-public-build/radar-android-v7.15.0.tar.xz.enc \
            -out "${RUNNER_TEMP}/radar-android-v7.15.0.tar.xz" \
            -pass env:RADAR_BUILD_KEY
          echo 'a89cf55de20190fe7068e08af1c11dd7c711350362f33171782de8b5326789e4  '"${RUNNER_TEMP}"'/radar-android-v7.15.0.tar.xz' | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/radar-android"
          tar -xJf "${RUNNER_TEMP}/radar-android-v7.15.0.tar.xz" -C "${RUNNER_TEMP}/radar-android"
          test -f "${RUNNER_TEMP}/radar-android/settings.gradle.kts"
          test -f "${RUNNER_TEMP}/radar-android/app/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/radar-android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${RUNNER_TEMP}/radar-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radar-Cripto-v7.15.0-debug-apk
          path: ${{ runner.temp }}/radar-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7